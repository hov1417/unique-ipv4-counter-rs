cargo-features = ["panic-immediate-abort"]

[package]
name = "unique-ipv4-counter-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
num_cpus = "1.16.0"
memmap2 = "0.9.5"
thread-priority = { version = "3.0.0", optional = true}
safe_arch = "1.0.0"

[dev-dependencies]
rand = "0.10.1"

[features]
max_thread_priority = ["thread-priority"]

[profile.release]
panic = "immediate-abort"
overflow-checks = false
opt-level = 3
debug = "full"
lto = true
codegen-units = 1
